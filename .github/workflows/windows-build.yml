name: Windows build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CoreRulesModern.sln

      - name: Build
        run: dotnet build CoreRulesModern.sln --configuration Release --no-restore

      - name: Read application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/CoreRulesModern/CoreRulesModern.csproj
          $version = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid application version: $version" }
          "APP_VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Run regression checks
        run: dotnet run --project tests/CoreRulesModern.SpellParserChecks/CoreRulesModern.SpellParserChecks.csproj --configuration Release --no-build

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish src/CoreRulesModern/CoreRulesModern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/CoreRulesLibrary-win-x64

      - name: Publish compact framework-dependent application
        run: >-
          dotnet publish src/CoreRulesModern/CoreRulesModern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/CoreRulesLibrary-win-x64-compact

      - name: Remove development-only files from publish folders
        shell: pwsh
        run: |
          @('artifacts/CoreRulesLibrary-win-x64', 'artifacts/CoreRulesLibrary-win-x64-compact') | ForEach-Object {
            Get-ChildItem $_ -Recurse -Include *.xml,*.pdb | Remove-Item -Force
          }

      - name: Package and checksum release artefacts
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $selfContained = "CoreRulesLibrary-win-x64-self-contained-v$version.zip"
          $compact = "CoreRulesLibrary-win-x64-compact-v$version.zip"
          Compress-Archive -Path artifacts/CoreRulesLibrary-win-x64/* -DestinationPath "artifacts/$selfContained"
          Compress-Archive -Path artifacts/CoreRulesLibrary-win-x64-compact/* -DestinationPath "artifacts/$compact"
          @($selfContained, $compact) | ForEach-Object {
            $hash = (Get-FileHash "artifacts/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Verify packaged archives
        shell: pwsh
        run: |
          $archives = Get-ChildItem artifacts -Filter *.zip
          if ($archives.Count -ne 2) { throw "Expected exactly two release archives." }
          foreach ($archive in $archives) {
            $destination = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive $archive.FullName $destination
            if (-not (Test-Path (Join-Path $destination "CoreRulesLibrary.exe"))) {
              throw "CoreRulesLibrary.exe is missing from $($archive.Name)."
            }
          }

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoreRulesLibrary-v${{ env.APP_VERSION }}
          path: |
            artifacts/CoreRulesLibrary-win-x64-self-contained-v${{ env.APP_VERSION }}.zip
            artifacts/CoreRulesLibrary-win-x64-compact-v${{ env.APP_VERSION }}.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
