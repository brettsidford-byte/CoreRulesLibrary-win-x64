name: Windows build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CoreRulesModern.sln

      - name: Build
        run: dotnet build CoreRulesModern.sln --configuration Release --no-restore

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish src/CoreRulesModern/CoreRulesModern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/CoreRulesLibrary-win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CoreRulesLibrary-win-x64
          path: artifacts/CoreRulesLibrary-win-x64/
          if-no-files-found: error
          retention-days: 30
