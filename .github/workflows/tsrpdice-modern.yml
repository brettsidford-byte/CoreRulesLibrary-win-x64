name: Build TSRPDice Modern
on:
  push:
    branches: [tsrpdice-modern-v1]
    paths: ['tools/TSRPDiceModern/**', '.github/workflows/tsrpdice-modern.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone EXE
        run: dotnet publish tools/TSRPDiceModern/TSRPDiceModern.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/TSRPDiceModern
      - uses: actions/upload-artifact@v4
        with:
          name: TSRPDiceModern-win-x64-v1.0
          path: publish/TSRPDiceModern/**
